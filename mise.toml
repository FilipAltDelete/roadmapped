# Entering this directory is enough to get a working environment.
#
# The toolchain is now two things: Node for the web client and Rust for the
# engine. Flutter, Java and the Android SDK are gone, along with the iOS signing
# chain they fed. That is the whole point of the web target.
#
# Node is pinned and duplicated in .github/workflows/web.yml. Change both
# together.
[tools]
node = "26.8.1"

# Rust stays on rustup rather than mise, because the wasm32 target is installed
# through rustup and having two toolchain managers disagree about which rustc is
# in scope is not worth the tidiness:
#
#   rustup target add wasm32-unknown-unknown
