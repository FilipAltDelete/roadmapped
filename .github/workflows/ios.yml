# Builds the iOS app on a macOS runner, because the development machine is Linux.
#
# Free-tier reality: this produces an unsigned .app you install with SideStore or
# Sideloadly, and the signature it gets lasts seven days. There is no TestFlight
# and no App Store on a free Apple Developer account.
#
# Cost note: standard macOS runners are free and unmetered while this repo is
# public. They bill at ten times the Linux rate on private repos, which was the
# original reason this job is manual.
#
# It stays on workflow_dispatch anyway: the daily loop runs on Android and the
# iOS loop is weekly by design, so there is nothing to gain from building this
# on every push. See docs/setup.md.
name: ios

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: subosito/flutter-action@v2
        with:
          # Kept in step with mise.toml. Change both together.
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Build the Rust core for device
        run: cargo build --release --manifest-path crates/sketch-route/Cargo.toml --target aarch64-apple-ios

      - name: Build the app
        working-directory: app
        # Unsigned: signing happens on the phone via SideStore under a free account.
        run: flutter build ios --release --no-codesign

      - name: Package
        working-directory: app/build/ios/iphoneos
        run: |
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qry roadmapped.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: roadmapped-ipa
          path: app/build/ios/iphoneos/roadmapped.ipa
          retention-days: 14
