name: rust

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --manifest-path crates/sketch-route/Cargo.toml --check
      - run: cargo fmt --manifest-path crates/sketch-route-wasm/Cargo.toml --check
      - run: cargo clippy --manifest-path crates/sketch-route/Cargo.toml --all-targets -- -D warnings
      # Linted on the target it is actually compiled for, because that is where
      # a mistake in the seam would show up.
      - run: cargo clippy --manifest-path crates/sketch-route-wasm/Cargo.toml --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --manifest-path crates/sketch-route/Cargo.toml

      # The engine must keep cross-compiling to WebAssembly. This is the job the
      # aarch64-apple-ios build used to do: proof that the no-dependency rule in
      # crates/sketch-route is still earning its keep.
      - run: cargo build --release --target wasm32-unknown-unknown --manifest-path crates/sketch-route-wasm/Cargo.toml

  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Printed into the job log on every run, so a change in matching quality
      # shows up in the diff of two builds rather than being discovered later.
      - run: cargo run --release --quiet --example eval --manifest-path crates/sketch-route/Cargo.toml
